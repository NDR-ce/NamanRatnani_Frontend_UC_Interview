<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Perk Café - Create Account</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        :root {
            --white: #ffffff;
            --text-dark: #1e1a17;
            --text-muted: #8c7e74;
            --button-brown: #362214;
        }

        .auth-container {
            display: flex;
            min-height: 100vh;
            background-color: #FFFDF9;
        }

        .auth-graphic-panel {
            width: 480px; 
            max-width: 100%;
            min-height: 100vh;
            background-image: linear-gradient(rgba(30, 26, 23, 0.2), rgba(30, 26, 23, 0.4)), url('images/bg5.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px;
            color: var(--white);
        }

        .auth-form-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 10%;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #362214;
            margin-bottom: 25px;
        }

        .auth-form-panel h2 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 500;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            background-color: #F3EFE9;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #A59E99;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .checkbox-row a {
            color: var(--text-dark);
            text-decoration: underline;
        }

        .btn-auth-submit {
            width: 100%;
            background-color: var(--button-brown);
            color: var(--white);
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-auth-submit:hover {
            background-color: #21150C;
        }

        .switch-auth {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .switch-auth a {
            color: var(--text-dark);
            font-weight: 600;
            text-decoration: none;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            font-size: 0.75rem;
        }

        .footer-links a {
            color: #A59E99;
            text-decoration: none;
        }

        @media (max-width: 850px) {
            .auth-graphic-panel { display: none; }
            .auth-form-panel { padding: 40px 8%; }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-graphic-panel">
            <p style="font-size: 0.8rem; opacity: 0.8;">© 2026 Central Perk Café</p>
        </div>
        
        <div class="auth-form-panel">
            <div class="brand-header">
                ☕ Central Perk Café
            </div>

            <h2>Create Your Account</h2>
            <p class="subtitle">Join our digital living room for the finest brews and cozy moments.</p>

            <form action="#">
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="ri-user-line"></i></span>
                        <input type="text" placeholder="Phoebe Buffay" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="ri-mail-line"></i></span>
                        <input type="email" placeholder="smellycat@centralperk.com" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="ri-lock-line"></i></span>
                            <input type="password" placeholder="••••••••" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="ri-shield-keyhole-line"></i></span>
                            <input type="password" placeholder="••••••••" required>
                        </div>
                    </div>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I agree to the <a href="#">Terms of Service</a></label>
                </div>

                <button type="submit" class="btn-auth-submit">Sign Up</button>

                <p class="switch-auth">Already have an account? <a href="login.html">Login</a></p>
            </form>

            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Accessibility</a>
            </div>
        </div>
    </div>

</body>
</html>
