<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Perk Café - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            display: flex;
            min-height: 100vh;
            background-color: #FFFDF9;
        }
        .auth-graphic-panel {
    width: 512px; 
    max-width: 100%;
    height: 100%; 
    min-height: 100vh;
    background-image: linear-gradient(rgba(30, 26, 23, 0.2), rgba(30, 26, 23, 0.4)), url('images/bg2.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 40px;
    color: var(--white);
    position: relative;
}
        .copyright-tag {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .auth-form-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 12%;
        }
        .brand-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #362214;
            margin-bottom: 40px;
        }
        .auth-form-panel h2 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .forgot-pass {
            color: #8C7E74;
            text-decoration: none;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 40px;
            background-color: #F3EFE9;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-dark);
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #A59E99;
        }
        .toggle-visibility {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #A59E99;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            margin-top: 10px;
        }
        .btn-auth-submit {
            width: 100%;
            background-color: var(--button-brown);
            color: var(--white);
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-auth-submit:hover {
            background-color: #21150C;
        }
        .divider {
            text-align: center;
            margin: 20px 0;
            font-size: 0.75rem;
            color: #CCC;
            position: relative;
        }
        .btn-google {
            width: 100%;
            background-color: transparent;
            border: 1px solid #D5CFC7;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
        }
        .switch-auth {
            text-align: center;
            margin-top: 30px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .switch-auth a {
            color: var(--text-dark);
            font-weight: 600;
            text-decoration: none;
        }

        /* Responsive breakdown for split screens */
        @media (max-width: 850px) {
            .auth-graphic-panel { display: none; }
            .auth-form-panel { padding: 40px 8%; }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-graphic-panel">
            <div class="copyright-tag">© 2024 Central Perk Café. All rights reserved.</div>
        </div>
        <div class="auth-form-panel">
            <div class="brand-header">
                <span>☕</span> Central Perk Café
            </div>

            <h2>Welcome Back!</h2>
            <p class="subtitle">We've missed you. Log in to your account to continue your coffee journey.</p>
            <form action="#">
                <div class="form-group">
                    <label style="font-size: 0.8rem; font-weight: 500;">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="ri-mail-line"></i></span>
                        <input type="email" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-label-row">
                        <label>Password</label>
                        <a href="#" class="forgot-pass">Forgot Password?</a>
                    </div>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="ri-lock-line"></i></span>
                        <input type="password" placeholder="••••••••" required>
                        <span class="toggle-visibility"><i class="ri-eye-line"></i></span>
                    </div>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember for 30 days</label> 
                </div>

                <button type="submit" class="btn-auth-submit">LOGIN</button>

                <div class="divider">OR</div>

                <button type="button" class="btn-google">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v3.92h6.69c-.29 1.5-.14 2.5-.97 3.5v2.91h6.47c3.78-3.48 5.55-8.62 5.55-14.26z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-6.47-2.91c-.9.6-2.04.96-3.46.96-2.67 0-4.93-1.8-5.74-4.22H.72v3.01C2.7 21.92 7.03 24 12 24z"/><path fill="#FBBC05" d="M6.26 14.92c-.21-.63-.33-1.3-.33-2s.12-1.37.33-2V7.91H.72C.26 8.83 0 9.89 0 11s.26 2.17.72 3.09l5.54-3.17z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.03 0 2.7 2.08.72 5.09l5.54 3.17c.81-2.42 3.07-4.22 5.74-4.22z"/></svg>
                    Continue with Google
                </button>

                <p class="switch-auth">Don't have an account? <a href="signup.html">Sign Up</a></p>
            </form>
        </div>
    </div>

</body>
</html>
